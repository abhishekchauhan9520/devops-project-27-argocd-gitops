apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: gitops-demo-root
  namespace: argocd
spec:
  project: gitops-demo
  source:
    repoURL: https://github.com/abhishekchauhan9520/devops-project-27-argocd-gitops.git
    targetRevision: main
    path: argocd/apps
  destination:
    server: https://kubernetes.default.svc
    namespace: argocd
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=false
