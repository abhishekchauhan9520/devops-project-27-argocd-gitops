apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: gitops-demo-production
  namespace: argocd
spec:
  project: gitops-demo
  source:
    repoURL: https://github.com/abhishekchauhan9520/devops-project-27-argocd-gitops.git
    targetRevision: main
    path: apps/overlays/production
  destination:
    server: https://kubernetes.default.svc
    namespace: gitops-production
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
      allowEmpty: false
    syncOptions:
      - CreateNamespace=false
  revisionHistoryLimit: 10
